# Next.js runs on Netlify through its OpenNext runtime (@netlify/plugin-nextjs).
# Netlify only adds it on its own when it detects the framework while linking a
# repo in the UI, so it is declared here to make every build use it. Don't pin
# it in package.json: Netlify keeps it current for each new Next.js release.
#
# check:static runs after the build and fails the deploy if a prebuilt page would
# need a function on every view, or revalidates by time (scripts/check-static-pages.ts).
# Next gives no warning for either, and function calls are the metered cost here.
# A failed deploy leaves the last good one live.
[build]
  command = "bun run build && bun run check:static"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Open agentic web bundle (public/agent). Mirrors headers() in next.config.ts:
# the CDN serves public/ files directly, so Next's headers may not reach them.
[[headers]]
  for = "/agent/agent-manifest.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/agent/motion_garden.network.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/agent/links.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/agent/agent-mcp.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/agent/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/agent/runtime/sandbox-worker.js"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src blob:; connect-src 'none'; worker-src 'none'"
